<!doctype html>
<!--
  T2.7 — the voice client.

  One file, no build step, no framework. PRD FR-9 called for a React PWA; this is
  the same thing without the toolchain, and the toolchain is what would have to be
  justified: there is one screen, one WebSocket, and no routing. It runs from the
  Mac's own browser during Phase 2 and installs to the iPhone home screen to ship
  (both pre-flight gates passed — benchmarks/ios-audio.md).

  Audio in:  getUserMedia -> AudioWorklet -> Int16 PCM -> binary WS frames.
  Audio out: binary WS frames -> Float32 -> AudioBufferSourceNode, queued.
  Control:   JSON text frames both ways (speech/wire.py is the contract).

  The browser resamples to 16 kHz by asking for it. Safari on iOS ignores the
  request and hands back 48 kHz, so the worklet downsamples rather than trusting
  the constraint -- the pre-flight already showed iOS deciding capture parameters
  for itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ocha</title>
<style>
  :root { color-scheme: light dark; --bg:#faf8f5; --fg:#1c1917; --muted:#78716c;
          --accent:#3f6212; --panel:#fff; --line:#e7e5e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --accent:#a3e635;
            --panel:#292524; --line:#44403c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,
         BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
         padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:.75rem; padding:1rem 0; }
  h1 { font-size:1.1rem; margin:0; font-weight:600; letter-spacing:.02em; }
  #state { margin-left:auto; font-size:.8rem; color:var(--muted); display:flex;
           align-items:center; gap:.4rem; }
  #dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--muted); }
  /* The turn-state indicator is G1a's visible half. It must change when the
     server says the state changed -- not on a timer, which would be theatre. */
  #dot.listening { background:#22c55e; animation:pulse 1.2s ease-in-out infinite; }
  #dot.transcribing { background:#eab308; animation:pulse .9s ease-in-out infinite; }
  #dot.thinking { background:#f97316; animation:pulse .7s ease-in-out infinite; }
  #dot.speaking { background:var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  button { font:inherit; padding:.5rem 1rem; border-radius:999px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  #log { display:flex; flex-direction:column; gap:.75rem; padding-bottom:2rem; }
  .turn { padding:.75rem 1rem; border-radius:.75rem; background:var(--panel);
          border:1px solid var(--line); }
  .turn.you { border-left:3px solid #22c55e; }
  .turn.tutor { border-left:3px solid var(--accent); }
  .turn.grammar { border-left:3px solid #eab308; }
  .who { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
         color:var(--muted); margin-bottom:.2rem; }
  .jp { font-size:1.15rem; }
  .interim { opacity:.55; font-style:italic; }
  .warn { margin-top:.5rem; font-size:.85rem; color:#eab308; }
  ul { margin:.4rem 0 0; padding-left:1.1rem; }
  li { font-size:.95rem; }
  #mode { display:flex; gap:.25rem; margin-bottom:1rem; }
  #mode button { flex:1; border-radius:.65rem; }
  #mode button[aria-pressed="true"] { background:var(--accent); color:var(--bg); }
  #mode-help, #voice-status { color:var(--muted); font-size:.8rem; margin:-.6rem 0 1rem; }
  .romaji { color:var(--accent); font-size:.95rem; margin-top:.2rem; }
  .meaning { color:var(--muted); font-size:.95rem; }
  .instruction { font-weight:600; margin-bottom:.5rem; }
  .actions { display:flex; gap:.4rem; margin-top:.7rem; }
  .actions button { padding:.35rem .75rem; font-size:.85rem; }
  #talk { position:sticky; bottom:max(.75rem, env(safe-area-inset-bottom)); z-index:2;
          padding:.75rem 0; background:linear-gradient(transparent, var(--bg) 30%); }
  #mic { width:100%; min-height:3.5rem; border-radius:1rem; border:0;
         background:var(--accent); color:var(--bg); font-weight:650; font-size:1.05rem; }
  #mic[data-recording="true"] { background:#dc2626; color:white; }
  #mic-hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:.25rem; }
</style>
</head>
<body>
<header>
  <h1>Ocha 🍵</h1>
  <span id="state"><span id="dot"></span><span id="label">idle</span></span>
</header>
<div id="mode" role="group" aria-label="Learning mode">
  <button type="button" data-mode="guided">Guided lessons</button>
  <button type="button" data-mode="conversation">Conversation</button>
</div>
<div id="mode-help"></div>
<div id="voice-status" role="status"></div>
<div id="log"></div>
<div id="talk">
  <button id="mic" type="button">Start guided lesson</button>
  <div id="mic-hint">Audio stays off until you tap.</div>
</div>

<script type="module">
const RATE = 16000;           // must match speech/wire.py; not negotiated
const PLAYBACK_BUFFER_SECONDS = 0.150;
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const label = document.getElementById('label');
const micBtn = document.getElementById('mic');
const micHint = document.getElementById('mic-hint');
const modeHelp = document.getElementById('mode-help');
const voiceStatus = document.getElementById('voice-status');
const modeButtons = [...document.querySelectorAll('#mode button')];

const HEADER_BYTES = 26;      // OCH1 + version + kind + u32 seq + UUID
let ws, audioCtx, node, captureSource, muteNode, stream, playAt = 0;
let interimEl = null, tutorEl = null;
let lessonEl = null, guidedAudioBatch = [], mediaQueue = [], mediaBusy = false;
let pendingGuidedInstruction = '', recording = false, processing = false;
let currentMode = localStorage.getItem('ocha.mode');
if (!['guided', 'conversation'].includes(currentMode)) currentMode = 'guided';
const scheduled = new Map(); // exchange UUID -> {source,start,end,seq,kind}[]
const clientIntervals = new Map();
const clientVisible = new Map();

// The physical benchmark supplies speech_end_ms and ASR acceptance after each
// spoken turn. These retained client-clock records are the other half of that
// capture and deliberately contain no server absolute timestamps.
window.ochaCaptureV2 = () => ({
  protocol_version: 2,
  visible_by_exchange: Object.fromEntries(clientVisible),
  audio_by_exchange: Object.fromEntries(clientIntervals),
});

// The worklet: the only place audio is touched per-sample. Kept as a blob so the
// client stays one file -- an AudioWorklet must be loaded from a URL.
const workletSrc = `
class Capture extends AudioWorkletProcessor {
  constructor() {
    super();
    // sampleRate is the context's real rate, whatever the browser decided to give
    // us. iOS Safari ignores the 16 kHz constraint, so the ratio is computed here
    // rather than assumed.
    this.ratio = sampleRate / ${RATE};
    this.carry = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    // Linear decimation. Not a resampling filter: whisper is robust to the
    // aliasing this leaves, and a polyphase filter here would be a lot of code in
    // the one place that runs on the audio thread.
    const out = new Int16Array(Math.floor((ch.length - this.carry) / this.ratio) + 1);
    let n = 0;
    for (let i = this.carry; i < ch.length; i += this.ratio) {
      const s = Math.max(-1, Math.min(1, ch[Math.floor(i)]));
      out[n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    this.carry = (this.carry + n * this.ratio) - ch.length;
    if (n > 0) this.port.postMessage(out.subarray(0, n).buffer, [out.buffer]);
    return true;
  }
}
registerProcessor('capture', Capture);
`;

function setState(s) {
  dot.className = s;
  label.textContent = s;
  if (['transcribing', 'thinking', 'speaking'].includes(s)) processing = true;
  if (s === 'idle' && !recording) processing = false;
  updateMicButton();
}

function updateMicButton() {
  const connected = ws?.readyState === WebSocket.OPEN;
  micBtn.dataset.recording = String(recording);
  if (!connected) {
    micBtn.textContent = currentMode === 'guided' ? 'Start guided lesson' : 'Start conversation';
    micBtn.disabled = false;
    micHint.textContent = 'Audio stays off until you tap.';
  } else if (recording) {
    micBtn.textContent = 'Stop listening';
    micBtn.disabled = false;
    micHint.textContent = 'Speak now. Tap again when you finish.';
  } else if (mediaBusy) {
    micBtn.textContent = 'Listen…';
    micBtn.disabled = true;
    micHint.textContent = 'The microphone is off while Ocha speaks.';
  } else if (processing) {
    micBtn.textContent = 'Processing…';
    micBtn.disabled = true;
    micHint.textContent = 'The microphone is off while Ocha responds.';
  } else {
    micBtn.textContent = 'Tap to speak';
    micBtn.disabled = false;
    micHint.textContent = 'Tap, speak, then tap again—or pause for one second.';
  }
}

function turn(kind, who) {
  const el = document.createElement('div');
  el.className = 'turn ' + kind;
  el.innerHTML = '<div class="who"></div><div class="jp"></div>';
  el.querySelector('.who').textContent = who;
  log.append(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

function updateMode() {
  for (const button of modeButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.mode === currentMode));
  }
  modeHelp.textContent = currentMode === 'guided'
    ? 'Start here: listen, repeat, then recall useful Japanese.'
    : 'Japanese audio with romaji and a complete English meaning.';
  updateMicButton();
}

for (const button of modeButtons) {
  button.onclick = () => {
    if (button.dataset.mode === currentMode) return;
    const running = ws?.readyState === WebSocket.OPEN;
    if (running) stop();
    currentMode = button.dataset.mode;
    localStorage.setItem('ocha.mode', currentMode);
    log.replaceChildren();
    lessonEl = tutorEl = interimEl = null;
    updateMode();
    if (running) start();
  };
}
updateMode();

function onMessage(ev) {
  if (ev.data instanceof ArrayBuffer) {
    if (currentMode === 'guided') guidedAudioBatch.push(ev.data);
    else play(ev.data);
    return;
  }
  const m = JSON.parse(ev.data);
  if (!m.exchange_id || !Number.isInteger(m.seq)) {
    throw new Error('Unattributed Ocha JSON event');
  }
  if (m.type === 'state') {
    if (m.state === 'transcribing' && recording) stopRecording(false);
    if (m.state === 'idle' && currentMode === 'guided') {
      flushGuidedAudio();
      if (pendingGuidedInstruction) {
        enqueueEnglish(pendingGuidedInstruction);
        pendingGuidedInstruction = '';
      }
    }
    const changed = label.textContent !== m.state;
    setState(m.state);
    if (changed) retainVisible(m);
    // A new listening state means the previous turn is over; the next tutor text
    // starts a new bubble rather than appending to the last one.
    if (m.state === 'listening') tutorEl = null;
  } else if (m.type === 'transcript') {
    if (!interimEl) interimEl = turn('you', 'you');
    const jp = interimEl.querySelector('.jp');
    jp.textContent = m.text;
    jp.classList.toggle('interim', !m.final);
    if (m.final) interimEl = null;
    retainVisible(m);
  } else if (m.type === 'reply') {
    if (!tutorEl) tutorEl = turn('tutor', 'ocha');
    tutorEl.querySelector('.jp').textContent += m.text;
    retainVisible(m);
  } else if (m.type === 'reply_aids') {
    if (!tutorEl) tutorEl = turn('tutor', 'ocha');
    addAid(tutorEl, 'romaji', m.romaji);
    addAid(tutorEl, 'meaning', m.meaning_en);
    retainVisible(m);
  } else if (m.type === 'lesson') {
    renderLesson(m);
    if (m.phase === 'repeat') pendingGuidedInstruction = m.instruction_en;
    else enqueueEnglish(m.instruction_en);
    retainVisible(m);
  } else if (m.type === 'grammar') {
    grammar(m);
    retainVisible(m);
  } else if (m.type === 'asr_rejected') {
    const el = turn('grammar', 'recognition retry');
    el.querySelector('.jp').textContent =
      `I may have misheard “${m.text}”. ${m.repair_text}`;
    retainVisible(m);
  } else if (m.type === 'interrupt') {
    cancelExchange(m.exchange_id);
  } else if (m.type === 'tutor_error') {
    const el = turn('grammar', 'please retry');
    el.querySelector('.jp').textContent = m.text;
    retainVisible(m);
  }
}

function addAid(el, className, text) {
  let aid = el.querySelector('.' + className);
  if (!aid) {
    aid = document.createElement('div');
    aid.className = className;
    el.append(aid);
  }
  aid.textContent = text || '';
}

function renderLesson(m) {
  if (!lessonEl || lessonEl.dataset.step !== m.step_id) {
    lessonEl = turn('tutor', m.lesson_title || 'guided lesson');
    lessonEl.dataset.step = m.step_id;
  }
  lessonEl.replaceChildren();
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = m.lesson_title || 'guided lesson';
  const instruction = document.createElement('div');
  instruction.className = 'instruction';
  instruction.textContent = m.instruction_en;
  const jp = document.createElement('div');
  jp.className = 'jp';
  jp.textContent = m.show_japanese ? m.japanese : '•••';
  lessonEl.append(who, instruction, jp);
  if (m.show_romaji) addAid(lessonEl, 'romaji', m.romaji);
  addAid(lessonEl, 'meaning', m.meaning_en);
  if (m.phase !== 'complete') {
    const actions = document.createElement('div');
    actions.className = 'actions';
    for (const [action, text] of [['replay','Replay'], ['reveal','Reveal'], ['skip','Skip']]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = text;
      button.onclick = () => lessonAction(action, m.lesson_id, m.step_id);
      actions.append(button);
    }
    lessonEl.append(actions);
  }
  lessonEl.scrollIntoView({ block:'end' });
}

function lessonAction(action, lessonId, stepId) {
  if (ws?.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type:'lesson_action', action,
    lesson_id:lessonId, step_id:stepId }));
}

function flushGuidedAudio() {
  if (!guidedAudioBatch.length) return;
  const batch = guidedAudioBatch;
  guidedAudioBatch = [];
  mediaQueue.push({ type:'audio', buffers:batch });
  processMediaQueue();
}

function enqueueEnglish(text) {
  if (!text) return;
  mediaQueue.push({ type:'speech', text });
  processMediaQueue();
}

async function processMediaQueue() {
  if (mediaBusy || !mediaQueue.length || !audioCtx) return;
  mediaBusy = true;
  updateMicButton();
  try {
    while (mediaQueue.length && audioCtx) {
      const item = mediaQueue.shift();
      if (item.type === 'speech') await speakLocalEnglish(item.text);
      else {
        for (const buffer of item.buffers) play(buffer);
        const waitMs = Math.max(0, (playAt - audioCtx.currentTime) * 1000);
        await new Promise(resolve => setTimeout(resolve, waitMs));
      }
    }
  } catch (err) {
    voiceStatus.textContent = `Audio could not play: ${err.message}`;
  } finally {
    mediaBusy = false;
    updateMicButton();
  }
}

async function localEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  let voices = speechSynthesis.getVoices();
  if (!voices.length) {
    await new Promise(resolve => {
      const done = () => { speechSynthesis.removeEventListener('voiceschanged', done); resolve(); };
      speechSynthesis.addEventListener('voiceschanged', done);
      setTimeout(done, 500);
    });
    voices = speechSynthesis.getVoices();
  }
  return voices.find(voice => voice.localService && /^en(-|_)/i.test(voice.lang)) || null;
}

async function speakLocalEnglish(text) {
  const voice = await localEnglishVoice();
  if (!voice) {
    voiceStatus.textContent = 'English audio is unavailable; instructions remain visible as text.';
    return;
  }
  voiceStatus.textContent = '';
  await new Promise(resolve => {
    const utterance = new SpeechSynthesisUtterance(text);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      resolve();
    };
    const timeout = setTimeout(() => {
      voiceStatus.textContent = 'English audio timed out; the instruction remains visible.';
      speechSynthesis.cancel();
      finish();
    }, 5000);
    utterance.voice = voice;
    utterance.lang = voice.lang;
    utterance.rate = 0.9;
    utterance.onend = utterance.onerror = finish;
    speechSynthesis.speak(utterance);
  });
}

function retainVisible(m) {
  const events = clientVisible.get(m.exchange_id) || [];
  events.push({ exchange_id:m.exchange_id, seq:m.seq,
    at_ms:audioCtx.currentTime * 1000, type:m.type });
  clientVisible.set(m.exchange_id, events);
}

function grammar(m) {
  const el = turn('grammar', m.entry_id ? 'grammar · ' + m.entry_id : 'grammar');
  el.querySelector('.jp').textContent = m.text;
  if (m.examples?.length) {
    const ul = document.createElement('ul');
    for (const ex of m.examples) {
      const li = document.createElement('li');
      li.textContent = ex;
      ul.append(li);
    }
    el.append(ul);
  }
  if (m.hindi_contrast) {
    const p = document.createElement('div');
    p.className = 'warn';
    p.textContent = m.hindi_contrast;
    el.append(p);
  }
  if (m.interference_warning) {
    const p = document.createElement('div');
    p.className = 'warn';
    p.textContent = '⚠ Hindi intuition misleads here.';
    el.append(p);
  }
  tutorEl = null;
}

function uuidString(bytes) {
  const hex = [...bytes].map(v => v.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

function parseAudio(buf) {
  const view = new DataView(buf);
  if (view.byteLength < HEADER_BYTES ||
      String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== 'OCH1' || view.getUint8(4) !== 1) {
    throw new Error('Invalid Ocha audio header');
  }
  const kind = view.getUint8(5);
  if (![1, 2, 3].includes(kind)) throw new Error('Invalid Ocha audio kind');
  return {
    kind,
    seq: view.getUint32(6, false),
    exchangeId: uuidString(new Uint8Array(buf, 10, 16)),
    pcm: new Int16Array(buf, HEADER_BYTES),
  };
}

function metric(exchangeId, event, seq, clientTimeMs, durationMs = null) {
  if (ws?.readyState !== 1) return;
  ws.send(JSON.stringify({ type:'client_metric', exchange_id:exchangeId, event,
    seq, client_time_ms:clientTimeMs, duration_ms:durationMs }));
}

function play(buf) {
  const packet = parseAudio(buf);
  const pcm = packet.pcm;
  const audio = audioCtx.createBuffer(1, pcm.length, RATE);
  const ch = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 0x8000;
  const src = audioCtx.createBufferSource();
  src.buffer = audio;
  src.connect(audioCtx.destination);
  // Queue against a cursor, not "now": chunks arrive in bursts and playing each
  // on arrival would overlap them into noise.
  const now = audioCtx.currentTime;
  if (playAt <= now) playAt = now + PLAYBACK_BUFFER_SECONDS;
  const start = playAt;
  const end = start + audio.duration;
  src.start(start);
  playAt = end;

  const entry = { source:src, start, end, seq:packet.seq, kind:packet.kind };
  const clips = scheduled.get(packet.exchangeId) || [];
  clips.push(entry);
  scheduled.set(packet.exchangeId, clips);
  const intervals = clientIntervals.get(packet.exchangeId) || [];
  intervals.push({ exchange_id:packet.exchangeId, seq:packet.seq, kind:packet.kind,
    start_ms:start * 1000, duration_ms:audio.duration * 1000, cancelled_at_ms:null });
  clientIntervals.set(packet.exchangeId, intervals);
  metric(packet.exchangeId, 'playback_start', packet.seq, start * 1000);
  metric(packet.exchangeId, 'playback_duration', packet.seq, start * 1000, audio.duration * 1000);
  src.onended = () => {
    const remaining = (scheduled.get(packet.exchangeId) || []).filter(x => x !== entry);
    if (remaining.length) scheduled.set(packet.exchangeId, remaining);
    else scheduled.delete(packet.exchangeId);
  };
}

function cancelExchange(exchangeId) {
  if (!audioCtx || !exchangeId) return;
  const now = audioCtx.currentTime;
  for (const clip of scheduled.get(exchangeId) || []) {
    if (clip.end > now) {
      try { clip.source.stop(now); } catch (_) {}
      metric(exchangeId, 'cancellation', clip.seq, now * 1000);
    }
  }
  for (const interval of clientIntervals.get(exchangeId) || []) {
    if (interval.start_ms + interval.duration_ms > now * 1000) {
      interval.cancelled_at_ms = now * 1000;
    }
  }
  scheduled.delete(exchangeId);
  playAt = Math.max(now, ...[...scheduled.values()].flat().map(x => x.end), now);
}

async function start() {
  micBtn.disabled = true;
  clientIntervals.clear();
  clientVisible.clear();
  try {
    await connect();
  } catch (err) {
    stop();
    // A denied microphone is the most likely first-run failure, and leaving the
    // button dead with no explanation is the worst way to report it.
    const el = turn('grammar', 'cannot start');
    el.querySelector('.jp').textContent =
      err.name === 'NotAllowedError'
        ? 'Microphone permission was denied. Allow it for this site and press Start again.'
        : `${err.name}: ${err.message}`;
    micBtn.disabled = false;
    setState('idle');
  }
}

async function connect() {
  // iPhone Safari only unlocks audible Web Audio while the tap gesture is still
  // active. Do this before awaiting microphone permission or server startup.
  audioCtx = new AudioContext();
  const unlock = audioCtx.createBufferSource();
  unlock.buffer = audioCtx.createBuffer(1, 1, RATE);
  unlock.connect(audioCtx.destination);
  unlock.start();
  await audioCtx.resume();

  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, sampleRate: RATE, echoCancellation: true,
             noiseSuppression: true, autoGainControl: true },
  });
  // Log what we actually got. The pre-flight found the capture device varies
  // between runs on the same phone, and a transcript quality question is
  // unanswerable without knowing which microphone produced the audio.
  const track = stream.getAudioTracks()[0];
  console.log('capture:', track.label, track.getSettings());
  track.enabled = false;

  captureSource = audioCtx.createMediaStreamSource(stream);
  try {
    const workletUrl = URL.createObjectURL(new Blob([workletSrc], { type: 'text/javascript' }));
    try {
      await audioCtx.audioWorklet.addModule(workletUrl);
      node = new AudioWorkletNode(audioCtx, 'capture');
    } finally {
      URL.revokeObjectURL(workletUrl);
    }
    node.port.onmessage = e => sendCaptured(e.data);
    captureSource.connect(node);
  } catch (err) {
    console.warn('AudioWorklet capture unavailable; using Safari fallback.', err);
    let carry = 0;
    node = audioCtx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = event => {
      const ch = event.inputBuffer.getChannelData(0);
      const ratio = audioCtx.sampleRate / RATE;
      const out = new Int16Array(Math.floor((ch.length - carry) / ratio) + 1);
      let n = 0;
      for (let i = carry; i < ch.length; i += ratio) {
        const sample = Math.max(-1, Math.min(1, ch[Math.floor(i)]));
        out[n++] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      carry = (carry + n * ratio) - ch.length;
      if (n) sendCaptured(out.slice(0, n).buffer);
    };
    muteNode = audioCtx.createGain();
    muteNode.gain.value = 0;
    captureSource.connect(node);
    node.connect(muteNode).connect(audioCtx.destination);
  }

  // Do not start a server lesson until microphone capture is usable. Otherwise
  // a Safari capture failure leaves an orphaned lesson playing indefinitely.
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?mode=${currentMode}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = onMessage;
  ws.onclose = () => {
    recording = processing = false;
    setState('idle');
    micBtn.onclick = start;
  };
  await new Promise(r => ws.onopen = r);

  recording = processing = false;
  micBtn.onclick = startRecording;
  setState('idle');
}

function sendCaptured(buffer) {
  const appIsSpeaking = mediaBusy || audioCtx.currentTime < playAt;
  if (ws?.readyState === WebSocket.OPEN && recording && !appIsSpeaking) ws.send(buffer);
}

function startRecording() {
  if (ws?.readyState !== WebSocket.OPEN || mediaBusy || processing) return;
  recording = true;
  stream?.getAudioTracks().forEach(track => { track.enabled = true; });
  micBtn.onclick = () => stopRecording(true);
  setState('listening');
}

function stopRecording(sendTrailingSilence) {
  if (!recording) return;
  recording = false;
  stream?.getAudioTracks().forEach(track => { track.enabled = false; });
  if (sendTrailingSilence && ws?.readyState === WebSocket.OPEN) {
    ws.send(new Int16Array(RATE).buffer);
  }
  processing = true;
  micBtn.onclick = startRecording;
  setState('transcribing');
}

function stop() {
  node?.disconnect();
  captureSource?.disconnect();
  muteNode?.disconnect();
  ws?.close();
  stream?.getTracks().forEach(t => t.stop());
  audioCtx?.close();
  ws = audioCtx = node = captureSource = muteNode = stream = null;
  playAt = 0;
  scheduled.clear();
  guidedAudioBatch = [];
  mediaQueue = [];
  mediaBusy = false;
  pendingGuidedInstruction = '';
  recording = processing = false;
  window.speechSynthesis?.cancel();
  micBtn.textContent = 'Start';
  micBtn.onclick = start;
  setState('idle');
}

micBtn.onclick = start;
</script>
</body>
</html>
