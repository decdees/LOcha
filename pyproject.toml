[project]
name = "ocha"
version = "0.0.0"
description = "Self-hosted Japanese conversation tutor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fsrs>=6.3.1",
    "fugashi>=1.5.2",
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
    "unidic-lite>=1.0.8",
    "uvicorn>=0.52.0",
]

# Phase 0 only. mlx and mlx-lm moved OUT of this group in T1.7: the LLM service is
# application code, not a benchmark, so they belong in [project] dependencies.
# Leaving them here meant `uv run pytest` could not import mlx_lm at all.
# mlx-whisper stays until Phase 2 needs it in the app.
[dependency-groups]
bench = [
  "mlx-whisper>=0.4",
  "jiwer>=3.0",
  "huggingface-hub>=0.26",
  "parakeet-mlx>=0.5.2",
]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocha"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# benchmarks/ is Phase 0 output -- finished measurement scripts whose numbers are
# cited in the reports. Reformatting them risks editing code that produced
# published figures, for no benefit. Same reasoning as the mypy override below.
# *.md excluded too: ruff 0.16 formats python blocks inside markdown, and the
# design docs' illustrative snippets are prose, not source.
extend-exclude = ["benchmarks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# benchmarks/ is Phase 0 output: reports and the scripts that produced them.
# It is deliberately outside the strict-typing surface -- retyping finished
# measurement scripts buys nothing and risks editing numbers that are cited.
[[tool.mypy.overrides]]
module = "benchmarks.*"
ignore_errors = true

# MLX and the Japanese NLP stack ship no type information. Declaring that is
# honest; adding per-call ignores would scatter the same fact across the code.
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "mlx_whisper.*", "fugashi.*", "parakeet_mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests are excluded by default and run by `make test-slow`. They load the
# real model, which the stub suite never does -- and that gap is not theoretical:
# the MLX thread-locality bug (T1.8) was invisible to every stub-based test and
# only appeared when the real model ran behind the real transport.
addopts = "-q -m 'not slow'"
markers = ["slow: loads the real model; excluded from the default run"]
